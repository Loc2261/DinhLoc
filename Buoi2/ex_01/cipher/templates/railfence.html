<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rail Fence Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <table class="table">
            <tr>
                <td style="text-align: center; font-weight: bold; font-size: 25px;">RAIL FENCE CIPHER</td>
            </tr>
            <tr>
                <td style="font-weight: bold; color: blue;">ENCRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form method="POST" action="/api/railfence/encrypt">
                        <div class="mb-3">
                            <label for="railfencePlainText" class="form-label">Plain text:</label>
                            <input type="text" class="form-control" id="railfencePlainText" name="plain_text" placeholder="Input Plain Text" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label for="railfenceKeyEncrypt" class="form-label">Key (number of rails):</label>
                            <input type="number" class="form-control" id="railfenceKeyEncrypt" name="key" placeholder="Input Numeric Key" required/>
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                </td>
            </tr>
            <tr>
                <td style="font-weight: bold; color: blue;">DECRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form method="POST" action="/api/railfence/decrypt">
                        <div class="mb-3">
                            <label for="railfenceCipherText" class="form-label">Cipher text:</label>
                            <input type="text" class="form-control" id="railfenceCipherText" name="cipher_text" placeholder="Input Cipher Text" required/>
                        </div>
                        <div class="mb-3">
                            <label for="railfenceKeyDecrypt" class="form-label">Key (number of rails):</label>
                            <input type="number" class="form-control" id="railfenceKeyDecrypt" name="key" placeholder="Input Numeric Key" required/>
                        </div>
                        <button type="submit" class="btn btn-primary">Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
